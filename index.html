
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#170916">
    <meta name="description" content="Uma mensagem especial feita com carinho.">

    <title>Você é especial ❤️</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="cartao">
        <span class="etiqueta">UM CARINHO PARA VOCÊ</span>

        <h1>Você é especial <span>❤️</span></h1>

        <p class="descricao">
            Às vezes, um pequeno gesto pode tornar o dia de alguém mais bonito.
        </p>

        <button
            class="coracao"
            id="coracao"
            type="button"
            aria-label="Clique para espalhar corações"
        >
            <span aria-hidden="true">❤</span>
        </button>

        <p class="instrucao" id="instrucao" aria-live="polite">
            Toque no coração ✨
        </p>

        <div class="linha-decorativa"></div>

        <p class="rodape">Feito com carinho, especialmente para você.</p>
    </main>

    <div class="fundo-particulas" id="fundo-particulas"
         aria-hidden="true"></div>

    <div class="mensagem-flutuante" id="mensagem-flutuante"
         aria-hidden="true"></div>
</body>
</html>
